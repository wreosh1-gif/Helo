<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الوزن المثالي - رشاقتك بالأصفر</title>
    <style>
        :root {
            --primary: #FFD700; /* أصفر فاقع */
            --dark: #1a1a1a;
            --white: #ffffff;
        }

        body {
            background-color: var(--primary);
            color: var(--dark);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--white);
            padding: 30px;
            margin-top: 50px;
            border-radius: 20px;
            box-shadow: 10px 10px 0px var(--dark);
            border: 3px solid var(--dark);
        }

        h1 { text-align: center; margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--dark);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            background: var(--dark);
            color: var(--primary);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .ad-space {
            margin: 20px 0;
            border: 2px dashed #ccc;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ميزانك ⚖️</h1>
        
        <!-- إعلان Adsterra علوي -->
        <div class="ad-space">
            <!-- PLACE YOUR ADSTERRA BANNER CODE HERE -->
            إعلان (بنسل علوي)
        </div>

        <div class="input-group">
            <label>الطول (سم):</label>
            <input type="number" id="height" placeholder="مثال: 170">
        </div>

        <div class="input-group">
            <label>الوزن (كجم):</label>
            <input type="number" id="weight" placeholder="مثال: 70">
        </div>

        <button class="btn" onclick="calculateBMI()">احسب النتيجة الآن</button>

        <div id="result"></div>

        <!-- إعلان Adsterra سفلي -->
        <div class="ad-space">
            <!-- PLACE YOUR ADSTERRA BANNER CODE HERE -->
            إعلان (بنسل سفلي)
        </div>
    </div>

    <script>
        function calculateBMI() {
            const h = document.getElementById('height').value / 100;
            const w = document.getElementById('weight').value;
            const resDiv = document.getElementById('result');

            if(h > 0 && w > 0) {
                const bmi = (w / (h * h)).toFixed(1);
                let msg = "";
                let color = "";

                if(bmi < 18.5) { msg = "نقص في الوزن"; color = "#ffeb3b"; }
                else if(bmi < 25) { msg = "وزن مثالي ✅"; color = "#4caf50"; }
                else if(bmi < 30) { msg = "زيادة في الوزن"; color = "#ff9800"; }
                else { msg = "سمنة مفرطة ⚠️"; color = "#f44336"; }

                resDiv.style.display = "block";
                resDiv.style.backgroundColor = color;
                resDiv.innerHTML = `مؤشر كتلة جسمك هو: ${bmi} <br> حالتك: ${msg}`;
            } else {
                alert("يرجى إدخال أرقام صحيحة");
            }
        }
    </script>
</body>
</html>
