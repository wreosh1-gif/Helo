<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تيك داون - الأصفر</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --dark-yellow: #FFC107;
            --bg-black: #121212;
            --text-dark: #1a1a1a;
        }

        body {
            background-color: var(--primary-yellow);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            padding: 30px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid var(--text-dark);
            box-shadow: 10px 10px 0px var(--text-dark);
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; text-transform: uppercase; }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--text-dark);
            border-radius: 10px;
            background: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .download-btn {
            width: 100%;
            background: var(--bg-black);
            color: var(--primary-yellow);
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .download-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 5px 5px 0px #555;
        }

        .ad-box {
            margin: 20px 0;
            width: 100%;
            min-height: 100px;
            border: 2px dashed var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        footer { margin-top: auto; padding: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>تيك داون 🎬</h1>
        <p>أسرع تحميل بلون الشمس</p>
    </header>

    <div class="container">
        <!-- مكان إعلان Adsterra العلوي -->
        <div class="ad-box">
            <!-- ضغ كود الإعلان هنا -->
             AD SPACE
        </div>

        <input type="text" placeholder="الصق رابط تيك توك هنا...">
        <button class="download-btn">بدء التحميل الآن</button>

        <!-- مكان إعلان Adsterra السفلي -->
        <div class="ad-box">
            <!-- ضغ كود الإعلان هنا -->
             AD SPACE
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة لموقعك الأصفر © 2026
    </footer>

</body>
</html>
